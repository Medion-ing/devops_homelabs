---
- name: Deploy forward zone file
  ansible.builtin.template:
    src: db.forward.j2
    dest: "/etc/bind/db.{{ bind9_domain }}"
    owner: bind
    group: bind
    mode: '0644'
  notify: Reload bind9

- name: Deploy reverse zone file
  ansible.builtin.template:
    src: db.reverse.j2
    dest: "/etc/bind/db.{{ bind9_network }}"
    owner: bind
    group: bind
    mode: '0644'
  notify: Reload bind9

- name: Check zone syntax (forward)
  ansible.builtin.command:
    cmd: "named-checkzone {{ bind9_domain }} /etc/bind/db.{{ bind9_domain }}"
  changed_when: false

- name: Check zone syntax (reverse)
  ansible.builtin.command:
    cmd: "named-checkzone {{ bind9_network }}.in-addr.arpa /etc/bind/db.{{ bind9_network }}"
  changed_when: false
