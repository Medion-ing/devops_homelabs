---
- name: Reload VictoriaMetrics single
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ victoriametrics_http_port }}/-/reload"
    method: POST
    status_code: 200
  failed_when: false
  changed_when: true

- name: Restart VictoriaMetrics single
  ansible.builtin.systemd_service:
    name: "{{ victoriametrics_service_name }}"
    state: restarted
    daemon_reload: true
