apiVersion: v1
kind: Pod
metadata:
  name: csi-s3-test-nginx
  namespace: s3-mount-poc
spec:
  containers:
   - name: csi-s3-test-nginx
     image: nginx
     volumeMounts:
       - mountPath: /usr/share/nginx/html/s3
         name: webroot
  volumes:
   - name: webroot
     persistentVolumeClaim:
       claimName: rustfs-pvc
       readOnly: false